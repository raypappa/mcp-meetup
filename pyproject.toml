[project]
name = "mcp-meetup"
version = "2.0.0"
description = "MCP server that integrates Meetup.com event discovery with Anthropic Claude for AI-powered recommendations"
readme = "README.md"
authors = [
    { name = "raypappa", email = "181794460+raypappa@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "anthropic>=2.4.0",
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.2",
    "python-dateutil>=4.0.0",
]

[project.scripts]
mcp-meetup = "mcp_meetup.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
